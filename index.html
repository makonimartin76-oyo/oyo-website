<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYO! (Pvt) Ltd | Sovereign AI of Zimbabwe</title>
    <style>
        :root {
            --zim-green: #006400;
            --zim-gold: #FFD700;
            --zim-red: #FF0000;
            --bg-dark: #0a0f0a;
            --bg-card: rgba(20, 30, 20, 0.7);
            --text-primary: #f0f0f0;
            --text-secondary: #a0b0a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Roboto', monospace;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }
        /* Animated Background Grid */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 100, 0, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 100, 0, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(40px); } }

        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        
        /* Header */
        header { text-align: center; padding: 4rem 1rem 2rem; }
        .logo-shake { display: inline-block; animation: shake 0.8s cubic-bezier(.36,.07,.19,.97) both; font-size: 3rem; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(2px, 0, 0) rotate(2deg); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0) rotate(-4deg); }
            40%, 60% { transform: translate3d(4px, 0, 0) rotate(4deg); }
        }
        h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin-top: 1rem; }
        .highlight { color: var(--zim-gold); }
        .subtitle { font-size: 1.2rem; color: var(--text-secondary); max-width: 700px; margin: 1rem auto; }

        /* Live Metrics Dashboard */
        .metrics-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem; margin: 3rem 0;
        }
        .metric-card {
            background: var(--bg-card); border: 1px solid rgba(0, 100, 0, 0.3);
            border-radius: 12px; padding: 1.5rem; text-align: center;
            backdrop-filter: blur(10px); transition: transform 0.3s, border-color 0.3s;
        }
        .metric-card:hover { transform: translateY(-5px); border-color: var(--zim-gold); }
        .metric-value { font-size: 2.5rem; font-weight: 700; color: var(--zim-gold); font-family: monospace; }
        .metric-label { font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-top: 0.5rem; }
        .status-dot { display: inline-block; width: 10px; height: 10px; background: #00ff00; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }
